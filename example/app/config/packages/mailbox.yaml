# Every key has a default; spelled out here as the reference for what a host
# application may tune.
mailbox:
    per_page: 20
    inbox_limit: 100
    # No wait between two messages: the demo sends several in a row.
    flood_interval: 0
    subject_max_length: 55
    content_max_length: 10000
    max_recipients: 5
    required_role: ROLE_USER
